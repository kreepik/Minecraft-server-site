<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINECRAFT SERVER — Игровой портал</title>
    <style>
        @font-face {
            font-family: 'MinecraftTitleCyrillic';
            src: url('minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'MinecraftTitleCyrillic', 'Courier New', monospace;
            border-radius: 0 !important;
            image-rendering: pixelated;
        }

        body {
            background-color: #1e1e1e;
            background-image:
                linear-gradient(45deg, rgba(60, 60, 60, 0.15) 2px, transparent 2px),
                linear-gradient(-45deg, rgba(60, 60, 60, 0.15) 2px, transparent 2px),
                linear-gradient(0deg, rgba(40, 40, 40, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(76, 175, 80, 0.08) 0%, transparent 60%);
            background-size: 32px 32px, 32px 32px, 8px 8px, 100% 100%;
            background-attachment: fixed;
            color: #E0E0E0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8);
        }

        .particles-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            top: -10px;
            width: 8px; height: 8px;
            background: radial-gradient(circle at 30% 30%, #a5d6a7, #2e7d32);
            box-shadow: 0 0 8px #4caf50, 0 0 12px rgba(76, 175, 80, 0.5);
            border-radius: 50% !important;
            opacity: 0;
            animation: floatParticle linear infinite;
            will-change: transform;
        }

        @keyframes floatParticle {
            0% { transform: translateY(-20px) translateX(0px) scale(0.8); opacity: 0; }
            10% { opacity: 0.9; }
            30% { transform: translateY(30vh) translateX(15px) scale(1.2); opacity: 0.8; }
            60% { transform: translateY(65vh) translateX(-20px) scale(0.9); opacity: 0.5; }
            85% { transform: translateY(85vh) translateX(10px) scale(0.7); opacity: 0.2; }
            100% { transform: translateY(105vh) translateX(-5px) scale(0.5); opacity: 0; }
        }

        .header-premium {
            background: #2d2d2d;
            border-bottom: 5px solid #4caf50;
            padding: 28px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 100;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.15) 20px, rgba(0,0,0,0.15) 21px);
        }

        .header-premium::after {
            content: "";
            position: absolute;
            bottom: -7px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4caf50, #81c784, #4caf50);
            z-index: 101;
            pointer-events: none;
            box-shadow: 0 0 12px #4caf50;
        }

        .nav-vertical-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-item-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            height: 72px;
        }

        .nav-icon-block {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #545454;
            border: 4px solid #000000;
            box-shadow: inset -3px -3px 0 #2a2a2a, inset 3px 3px 0 #7a7a7a;
            width: 72px; height: 72px;
            padding: 12px;
            z-index: 3;
            transition: transform 0.1s ease, box-shadow 0.1s;
            cursor: pointer;
        }

        .nav-icon {
            width: 40px; height: 40px;
            flex-shrink: 0;
            transition: transform 0.1s;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.5));
            object-fit: contain;
        }

        .nav-item-wrapper:hover .nav-icon-block {
            transform: scale(0.94);
            box-shadow: inset -2px -2px 0 #2a2a2a, inset 2px 2px 0 #9a9a9a, 0 3px 0 #000;
        }
        .nav-item-wrapper:hover .nav-icon {
            transform: scale(0.94);
        }

        .mc-nav-drawer-btn {
            position: absolute;
            left: 68px;
            height: 72px;
            width: 0;
            background: #545454;
            border: 4px solid #000000;
            border-left: none;
            box-shadow: inset -3px -3px 0 #2a2a2a, inset 0px 3px 0 #7a7a7a;
            display: flex;
            align-items: center;
            overflow: hidden;
            z-index: 2;
            text-decoration: none;
            opacity: 0;
            transition: width 0.3s cubic-bezier(0.2, 0.9, 0.4, 1) 0.06s, opacity 0.2s 0.06s;
        }

        .nav-item-wrapper:hover .mc-nav-drawer-btn {
            width: 210px;
            opacity: 1;
        }

        .mc-nav-drawer-btn:hover { background: #6b6b6b; }

        .nav-text {
            font-size: 20px;
            color: #fff;
            position: absolute;
            left: 22px;
            white-space: nowrap;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000;
            transition: transform 0.05s;
        }

        .mc-nav-drawer-btn:active {
            box-shadow: inset 4px 4px 0 #000, inset -2px -2px 0 #2a2a2a;
            background: #3e3e3e;
        }
        .mc-nav-drawer-btn:active .nav-text { transform: translate(2px, 2px); }

        .wrapper-donate .nav-icon-block {
            background: #2e7d32;
            box-shadow: inset -3px -3px 0 #1b5e20, inset 3px 3px 0 #66bb6a;
        }
        .btn-donate-drawer {
            background: #2e7d32;
            box-shadow: inset -3px -3px 0 #1b5e20, inset 0px 3px 0 #66bb6a;
        }
        .btn-donate-drawer:hover { background: #388e3c; }

        .server-title-clean {
            font-weight: normal;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #000000, 0 0 20px rgba(76, 175, 80, 0.7), 0 0 40px rgba(76, 175, 80, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .title-line {
            display: block;
            letter-spacing: 4px;
        }
        .title-line:first-child { font-size: 48px; }
        .title-line:last-child { font-size: 36px; }

        .title-icon {
            width: 36px;
            height: 36px;
            margin-top: 12px;
            filter: drop-shadow(0 0 12px #4caf50);
            animation: pickaxeSwing 2.5s ease-in-out infinite;
            object-fit: contain;
        }

        @keyframes pickaxeSwing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-15deg); }
        }

        .main-content {
            flex-grow: 1;
            padding: 40px 20px 50px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            z-index: 5;
            position: relative;
        }

        .map-container-clean {
            width: 100%;
            max-width: 1150px;
            height: 72vh;
            background-color: #1e1e1e;
            border: 6px solid #000;
            box-shadow:
                inset 0 0 30px rgba(76, 175, 80, 0.25),
                0 0 0 5px #2d2d2d,
                0 0 0 11px #000,
                0 20px 50px rgba(0,0,0,0.8),
                0 0 80px rgba(76, 175, 80, 0.35);
            padding: 8px;
            display: flex;
            flex-direction: column;
            animation: portalGlow 3s infinite alternate;
            flex-shrink: 1;
        }

        @keyframes portalGlow {
            0% { box-shadow: inset 0 0 30px rgba(76, 175, 80, 0.25), 0 0 0 5px #2d2d2d, 0 0 0 11px #000, 0 20px 50px rgba(0,0,0,0.8), 0 0 80px rgba(76, 175, 80, 0.35); }
            100% { box-shadow: inset 0 0 45px rgba(76, 175, 80, 0.4), 0 0 0 5px #3a3a3a, 0 0 0 11px #000, 0 20px 50px rgba(0,0,0,0.8), 0 0 110px rgba(76, 175, 80, 0.55); }
        }

        .map-top-bar {
            background: #2d2d2d;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            color: #fff;
            border: 4px solid #000;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #000;
            box-shadow: inset -3px -3px 0 #1a1a1a, inset 3px 3px 0 #5a5a5a;
        }

        .map-iframe-holder {
            flex-grow: 1;
            background: #000;
            border: 4px solid #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Боковая панель */
        .server-sidebar {
            width: 250px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .server-status-box {
            background: #2d2d2d;
            border: 4px solid #000;
            box-shadow: inset -3px -3px 0 #1a1a1a, inset 3px 3px 0 #5a5a5a;
            padding: 20px;
            text-align: center;
        }

        .server-status-box h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
        }

        .status-indicator {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0 #000;
        }
        .status-indicator.online { color: #4caf50; }
        .status-indicator.offline { color: #f44336; }

        .progress-bar-bg {
            width: 100%;
            height: 18px;
            background: #000;
            border: 2px solid #000;
            margin-top: 10px;
            box-shadow: inset 2px 2px 0 #1a1a1a;
        }

        .progress-bar-fill {
            height: 100%;
            background: #4caf50;
            width: 0%;
            box-shadow: inset -2px -2px 0 #2e7d32, inset 2px 2px 0 #81c784;
        }

        .online-counter {
            font-size: 22px;
            color: #4caf50;
            text-shadow: 2px 2px 0 #000;
            margin-top: 10px;
        }

        .server-ip-box {
            background: #2d2d2d;
            border: 4px solid #000;
            box-shadow: inset -3px -3px 0 #1a1a1a, inset 3px 3px 0 #5a5a5a;
            padding: 15px;
            text-align: center;
        }

        .server-ip-box h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #000;
        }

        .server-ip-text {
            font-size: 16px;
            color: #a5d6a7;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 1px;
        }

        /* Подвал */
        .footer-premium {
            background: #2d2d2d;
            border-top: 5px solid #4caf50;
            padding: 45px 60px 30px;
            position: relative;
            z-index: 10;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        .footer-premium::before {
            content: "";
            position: absolute;
            top: -5px; left: 0;
            width: 100%; height: 2px;
            background: #81c784;
            box-shadow: 0 0 12px #4caf50;
        }

        .footer-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 45px;
            border-bottom: 3px solid #1e1e1e;
            padding-bottom: 35px;
        }

        .footer-col h3 {
            font-size: 22px;
            color: #81c784;
            margin-bottom: 18px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000;
        }

        .footer-col p {
            font-size: 16px;
            color: #a5d6a7;
            line-height: 1.8;
        }

        .footer-links-list { list-style: none; }
        .footer-links-list li { margin-bottom: 12px; }

        .footer-url {
            font-size: 18px;
            color: #a5d6a7;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s, color 0.15s;
            text-shadow: 1px 1px 0 #000;
        }

        .footer-url:hover {
            color: #fff;
            transform: translateX(8px);
            text-shadow: 0 0 8px #4caf50;
        }

        .footer-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: drop-shadow(1px 1px 0 #000);
        }

        .footer-bottom-bar {
            max-width: 1200px;
            margin: 22px auto 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #7a7a7a;
            letter-spacing: 1px;
            flex-wrap: wrap;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .header-premium {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
                align-items: flex-start;
            }
            .nav-vertical-left {
                flex-direction: column;
                gap: 14px;
                align-items: flex-start;
                width: 100%;
            }
            .nav-item-wrapper { height: 60px; }
            .nav-icon-block { width: 60px; height: 60px; padding: 10px; }
            .nav-icon { width: 34px; height: 34px; }
            .mc-nav-drawer-btn { height: 60px; left: 56px; }
            .nav-item-wrapper:hover .mc-nav-drawer-btn { width: 170px; }
            .nav-text { font-size: 18px; left: 16px; }
            .server-title-clean { align-self: center; }
            .title-line:first-child { font-size: 28px; letter-spacing: 2px; }
            .title-line:last-child { font-size: 22px; letter-spacing: 2px; }
            .title-icon { width: 24px; height: 24px; margin-top: 8px; }
            .main-content {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .server-sidebar {
                width: 100%;
                flex-direction: row;
                gap: 10px;
            }
            .server-status-box, .server-ip-box { flex: 1; }
            .map-container-clean { height: 55vh; }
        }
    </style>
</head>
<body>
