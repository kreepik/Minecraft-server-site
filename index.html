<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Название сервера | Официальный сайт</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0b0d10; color: #fff; }

        /* Верхняя панель */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(20, 22, 25, 0.9); }
        .logo { font-size: 24px; font-weight: bold; color: #7289da; }
        nav a { color: #ccc; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        nav a:hover { color: #fff; }

        /* Главный блок */
        .hero { text-align: center; padding: 100px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('bg.jpg'); background-size: cover; }
        .btn { padding: 15px 30px; background: #7289da; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn:hover { background: #5b6eae; transform: scale(1.05); }

        /* Секция карты */
        .content { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .map-wrapper { width: 100%; height: 600px; background: #16191e; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
    </style>
</head>
<body>

<header>
    <div class="logo">SERVER NAME</div>
    <nav>
        <a href="#">Главная</a>
        <a href="#">Форум</a>
        <a href="#">Магазин</a>
    </nav>
</header>

<div class="hero">
    <h1>Добро пожаловать на наш сервер!</h1>
    <p>Уникальный мир, выживание и крутое комьюнити.</p>
    <button class="btn" onclick="alert('Присоединяйся к нам в Discord!')">Discord сервера</button>
</div>

<div class="content">
    <h2>Мировая карта</h2>
    <div class="map-wrapper">
        <!-- Сюда в будущем встанет iframe с BlueMap -->
        <p style="color: #666;">Карта сервера подгружается при запуске...</p>
    </div>
</div>

</body>
</html>
